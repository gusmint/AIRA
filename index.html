    <script>
      // Ignore harmless Vite HMR WebSocket connection errors in sandboxed AI Studio preview iframe
      window.addEventListener('error', function(e) {
        if (e && (e.message?.includes('WebSocket') || e.filename?.includes('@vite/client') || (typeof e.error?.stack === 'string' && e.error.stack.includes('@vite/client')))) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        if (e && (e.reason?.message?.includes('WebSocket') || (typeof e.reason?.stack === 'string' && e.reason.stack.includes('@vite/client')))) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      }, true);
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
